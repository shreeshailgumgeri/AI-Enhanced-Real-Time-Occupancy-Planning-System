<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Enhanced Real-Time Occupancy Planning System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to the AI-Enhanced Occupancy Planning System</h1>
        <p>Find your ideal workspace with our intelligent recommendations.</p>
    </header>
    <main>
        <section id="query-section">
            <h2>Desk Query</h2>
            <input type="text" id="query-input" placeholder="Ask for a desk...">
            <button id="query-button">Find Desk</button>
        </section>
        <section id="results-section">
            <h2>Recommendations</h2>
            <ul id="results-list"></ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 AI-Enhanced Occupancy Planning System</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
